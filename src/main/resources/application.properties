spring.application.name=online-course-ai

# ===== 数据库连接配置 =====
spring.datasource.url=jdbc:mysql://localhost:3306/course_ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis 配置 =====
mybatis.configuration.map-underscore-to-camel-case=true

# ===== 大模型（豆包）配置 =====
# 豆包大模型 OpenAI 兼容接口地址（火山方舟）
llm.api-url=https://ark.cn-beijing.volces.com/api/v3/chat/completions
# 在 https://console.volcengine.com/ark 创建 API Key 后通过环境变量 LLM_API_KEY 注入；留空则自动使用 Mock 演示
llm.api-key=${LLM_API_KEY:}
# 模型名称：当前推荐 doubao-seed-2-1-pro-260628（火山方舟"开通管理"中确认可用模型）
llm.model=doubao-seed-2-1-pro-260628
