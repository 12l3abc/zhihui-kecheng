<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人资料 · 智绘课成</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6F7A'/%3E%3Cpath d='M14 18h36v8H14zM18 30h28v16H18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M18 30v-8M46 30v-8' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef3f5; --panel:#f7fafb; --line:#d9e2e7; --ink:#101a24; --muted:#5f7184;
  --accent:#1f6f7a; --accent-ink:#f4fbfc; --accent-tint:#dcebf0; --chip:#e8f0f3;
  --shadow:22,46,58;
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  --sans:"Plus Jakarta Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  --line-h:1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* 顶栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:20px 28px;border-bottom:var(--line-h) solid var(--line);background:var(--panel);
}
.brand{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.back{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:5px;
  border:var(--line-h) solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;
  transition:border-color .2s,background .2s;
}
.back:hover{border-color:var(--accent);background:var(--accent-tint)}

/* 主体：左账号卡 + 右表单 */
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{
  background:var(--panel);border:var(--line-h) solid var(--line);border-radius:8px;
  box-shadow:0 6px 22px rgba(var(--shadow),.10);padding:22px 22px 20px;
}
/* 左侧账号数据卡 */
.account{
  background:linear-gradient(180deg,var(--accent-tint) 0%,var(--panel) 46%);
  border:var(--line-h) solid var(--line);border-radius:8px;
  box-shadow:0 6px 22px rgba(var(--shadow),.10);padding:22px 20px;position:sticky;top:20px;
}
.ac-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{
  width:58px;height:58px;border-radius:14px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:23px;font-weight:700;flex-shrink:0;
}
.who h2{font-family:var(--serif);font-size:19px;margin-bottom:5px;line-height:1.2}
.who .sub{font-size:12px;color:var(--muted)}
.badge{
  font-family:var(--mono);font-size:10.5px;padding:3px 10px;border-radius:999px;
  border:var(--line-h) solid var(--line);color:var(--accent);background:#fff;display:inline-block;
}
.ac-kv{display:flex;flex-direction:column;gap:11px;border-top:var(--line-h) solid var(--line);padding-top:15px}
.ac-kv .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px}
.ac-kv .row dt{color:var(--muted);flex-shrink:0}
.ac-kv .row dd{font-weight:600;text-align:right;word-break:break-all;color:var(--ink)}
.ac-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ac-stat{background:#fff;border:var(--line-h) solid var(--line);border-radius:8px;padding:12px 8px;text-align:center}
.ac-stat .v{font-family:var(--serif);font-size:22px;font-weight:800;color:var(--accent);line-height:1.1}
.ac-stat .l{font-size:11px;color:var(--muted);margin-top:4px}
/* 卡片标题 */
.card-head{margin-bottom:16px}
.card-head h3{font-family:var(--serif);font-size:15.5px}
.card-head p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}

/* 表单 */
.frm-row{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.frm-row label{font-size:11.5px;color:var(--muted)}
.frm-row input{
  padding:10px 18px;border:var(--line-h) solid var(--line);border-radius:999px;
  background:var(--bg);color:var(--ink);font-size:13px;font-family:inherit;
}
.frm-row input:focus{outline:none;border-color:var(--accent)}
.msg{font-size:12px;color:var(--muted);min-height:16px;margin:2px 0 4px}
.msg.ok{color:var(--accent)}
.msg.err{color:#b3402f}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:5px;
  background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:600;
  transition:transform .12s,box-shadow .2s;
}
.pill:hover{box-shadow:0 4px 14px rgba(var(--shadow),.18)}
.pill:active{transform:translateY(1px)}
.pill.ghost{background:transparent;border:var(--line-h) solid var(--line);color:var(--ink)}
.pill.ghost:hover{background:var(--chip)}
.pill:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:14px}
  .account{position:static}
}
@media (max-width:600px){
  .topbar{padding:16px 18px}
  .wrap{padding:20px 14px 48px;gap:14px}
  .ac-stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">智绘课成<small>Student · 个人资料</small></div>
  <a class="back" href="student.html">← 返回学生端</a>
</header>

<main class="wrap">
  <aside class="account">
    <div class="ac-head">
      <div class="avatar" id="avatar">学</div>
      <div class="who">
        <h2 id="uName">—</h2>
        <p class="sub"><span class="badge" id="uRole">学生</span></p>
      </div>
    </div>
    <dl class="ac-kv">
      <div class="row"><dt>学号</dt><dd id="uUsername">—</dd></div>
      <div class="row"><dt>年级</dt><dd id="uGrade">—</dd></div>
      <div class="row"><dt>专业</dt><dd id="uMajor">—</dd></div>
      <div class="row"><dt>性别</dt><dd id="uGender">—</dd></div>
      <div class="row"><dt>手机号</dt><dd id="uPhone">—</dd></div>
      <div class="row"><dt>邮箱</dt><dd id="uEmail">—</dd></div>
      <div class="row"><dt>注册时间</dt><dd id="uCreated">—</dd></div>
    </dl>
    <div class="ac-stats">
      <div class="ac-stat"><div class="v" id="stTasks">—</div><div class="l">我的任务</div></div>
      <div class="ac-stat"><div class="v" id="stGrades">—</div><div class="l">归档成绩</div></div>
      <div class="ac-stat"><div class="v" id="stFavs">—</div><div class="l">我的收藏</div></div>
    </div>
  </aside>

  <div class="col">
  <section class="card">
    <div class="card-head">
      <h3>基本资料</h3>
      <p>更新你的昵称、手机号与邮箱，保存后立即生效。</p>
    </div>
    <div class="frm-row"><label>昵称 / 姓名</label><input id="pfRealName" type="text" maxlength="20" placeholder="请输入昵称或姓名"></div>
    <div class="frm-row"><label>手机号</label><input id="pfPhone" type="text" maxlength="11" placeholder="选填，11 位手机号"></div>
    <div class="frm-row"><label>邮箱</label><input id="pfEmail" type="text" placeholder="选填，用于接收通知"></div>
    <div class="msg" id="pfMsg"></div>
    <div class="foot"><button class="pill" id="saveBtn" onclick="saveProfile()">保存资料</button></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h3>修改密码</h3>
      <p>保留当前密码则本卡片可不填写；新密码至少 6 位。</p>
    </div>
    <div class="frm-row"><label>原密码</label><input id="pfOldPwd" type="password" autocomplete="off" placeholder="请输入当前密码"></div>
    <div class="frm-row"><label>新密码（至少 6 位）</label><input id="pfNewPwd" type="password" autocomplete="new-password" placeholder="设置新密码"></div>
    <div class="frm-row"><label>确认新密码</label><input id="pfNewPwd2" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div>
    <div class="msg" id="pwMsg"></div>
    <div class="foot"><button class="pill ghost" onclick="changePwd()">修改密码</button></div>
  </section>
  </div>
</main>

<script>
function api(url, method, body) {
  return fetch(url, {
    method: method || 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }).then(function (resp) { return resp.json(); });
}
function fmtTime(s) { return s ? String(s).replace('T', ' ').substring(0, 16) : '—'; }

var me = null;

function setMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.textContent = text || '';
  el.className = 'msg' + (ok ? ' ok' : (text ? ' err' : ''));
}

function genderTxt(g) {
  if (!g) return '—';
  var s = String(g).trim();
  if (s === 'M' || s === 'm') return '男';
  if (s === 'F' || s === 'f') return '女';
  return s;
}

function renderMe(u) {
  me = u;
  var name = u.realName || u.username || '学生';
  document.getElementById('uName').textContent = name;
  document.getElementById('avatar').textContent = name.slice(0, 1);
  document.getElementById('uUsername').textContent = u.username || '—';
  document.getElementById('uRole').textContent = u.role === 'teacher' ? '教师' : '学生';
  document.getElementById('uGrade').textContent = u.grade || '—';
  document.getElementById('uMajor').textContent = u.major || '—';
  document.getElementById('uGender').textContent = genderTxt(u.gender);
  document.getElementById('uPhone').textContent = u.phone || '未绑定';
  document.getElementById('uEmail').textContent = u.email || '未绑定';
  document.getElementById('uCreated').textContent = fmtTime(u.createdAt);
  document.getElementById('pfRealName').value = u.realName || '';
  document.getElementById('pfPhone').value = u.phone || '';
  document.getElementById('pfEmail').value = u.email || '';
}

/* 账号统计：任务数 / 归档成绩 / 本地收藏，均为真实接口或同口径存储 */
function loadAccountStats() {
  api('/api/tasks/my').then(function (r) {
    var el = document.getElementById('stTasks');
    if (el) el.textContent = r.code === 200 ? (r.data || []).length : '—';
  }).catch(function () {});
  api('/api/grades/my').then(function (r) {
    var el = document.getElementById('stGrades');
    if (el) el.textContent = r.code === 200 ? (r.data || []).length : '—';
  }).catch(function () {});
  try {
    var favs = JSON.parse(localStorage.getItem('cwl_fav_cws')) || [];
    document.getElementById('stFavs').textContent = favs.length;
  } catch (e) { document.getElementById('stFavs').textContent = 0; }
}

function loadMe() {
  api('/api/auth/me').then(function (res) {
    if (res.code === 401 || !res.data) { window.location.href = 'index.html'; return; }
    renderMe(res.data);
    loadAccountStats();
  }).catch(function () { window.location.href = 'index.html'; });
}

function saveProfile() {
  var body = {
    realName: document.getElementById('pfRealName').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
    email: document.getElementById('pfEmail').value.trim()
  };
  if (!body.realName) { setMsg('pfMsg', '昵称不能为空', false); return; }
  if (body.phone && !/^1[3-9]\d{9}$/.test(body.phone)) { setMsg('pfMsg', '手机号格式不正确', false); return; }
  if (body.email && !/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(body.email)) { setMsg('pfMsg', '邮箱格式不正确', false); return; }
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  api('/api/auth/profile', 'POST', body).then(function (res) {
    btn.disabled = false;
    if (res.code !== 200) { setMsg('pfMsg', res.message || '保存失败', false); return; }
    setMsg('pfMsg', '资料已保存', true);
    if (res.data) renderMe(res.data);
  }).catch(function () { btn.disabled = false; setMsg('pfMsg', '网络异常，请稍后重试', false); });
}

function changePwd() {
  var old = document.getElementById('pfOldPwd').value;
  var nw = document.getElementById('pfNewPwd').value;
  var nw2 = document.getElementById('pfNewPwd2').value;
  if (!old) { setMsg('pwMsg', '请填写原密码', false); return; }
  if (nw.length < 6) { setMsg('pwMsg', '新密码至少 6 位', false); return; }
  if (nw !== nw2) { setMsg('pwMsg', '两次输入的新密码不一致', false); return; }
  api('/api/auth/password', 'POST', { oldPassword: old, newPassword: nw }).then(function (res) {
    if (res.code !== 200) { setMsg('pwMsg', res.message || '修改失败', false); return; }
    setMsg('pwMsg', '密码已修改', true);
    document.getElementById('pfOldPwd').value = '';
    document.getElementById('pfNewPwd').value = '';
    document.getElementById('pfNewPwd2').value = '';
  }).catch(function () { setMsg('pwMsg', '网络异常，请稍后重试', false); });
}

loadMe();
</script>
</body>
</html>
