<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人设置 · 智绘课成</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6F7A'/%3E%3Cpath d='M14 18h36v8H14zM18 30h28v16H18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M18 30v-8M46 30v-8' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef3f5; --panel: #f7fafb; --line: #d9e2e7; --ink: #101a24; --muted: #5f7186;
  --accent: #1f6f7a; --accent-ink: #ffffff; --accent-tint: #dceef0; --chip: #e4ebef;
  --shadow: 26,42,56; --ease: cubic-bezier(.22,.8,.24,1); --red: #c41e3a;
}
html[data-theme="dark"] {
  --bg: #060d18; --panel: #0b1626; --line: #18293e; --ink: #e6eef5; --muted: #8497ab;
  --accent: #5fd0d8; --accent-ink: #04121c; --accent-tint: #0f2737; --chip: #101e30;
  --shadow: 2,8,16; --red: #e0556e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito Sans', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100dvh;
  -webkit-font-smoothing: antialiased; transition: background .6s var(--ease), color .6s var(--ease);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 20px 28px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; font-family: 'Nunito Sans', sans-serif; font-size: 9px; letter-spacing: .18em; color: var(--muted); margin-top: 3px; text-transform: uppercase; }
.back {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px;
  transition: border-color .2s, background .2s;
}
.back:hover { border-color: var(--accent); background: var(--accent-tint); }

.wrap {
  max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px;
  display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start;
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 6px 22px rgba(var(--shadow),.10); padding: 24px;
}

/* 左栏：个人概览 */
.profile-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; position: sticky; top: 24px; }
.avatar {
  width: 78px; height: 78px; border-radius: 22px; background: var(--accent-tint); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif;
  font-size: 30px; font-weight: 600; flex-shrink: 0;
}
.who h2 { font-family: 'Newsreader', Georgia, serif; font-size: 20px; margin-bottom: 6px; }
.who .sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 10.5px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--accent); background: var(--accent-tint);
}
.acct-list { width: 100%; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.acct-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12.5px; }
.acct-row .k { color: var(--muted); }
.acct-row .v { color: var(--ink); font-weight: 600; text-align: right; word-break: break-all; }
.acct-actions { width: 100%; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.acct-actions .pill { width: 100%; }

.card-head { margin-bottom: 18px; }
.card-head h3 { font-family: 'Newsreader', Georgia, serif; font-size: 16.5px; }
.card-head p { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.6; }

/* 右栏：表单两列 */
.frm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.frm-row { display: flex; flex-direction: column; gap: 6px; }
.frm-row.full { grid-column: 1 / -1; }
.frm-row label { font-size: 11.5px; letter-spacing: .04em; color: var(--muted); }
.frm-row input {
  height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font-size: 13.5px; font-family: inherit; outline: none;
}
.frm-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.msg { font-size: 12px; color: var(--muted); min-height: 16px; margin: 10px 0 4px; }
.msg.ok { color: var(--accent); }
.msg.err { color: var(--red); }
.foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-size: 13.5px; font-weight: 600;
  transition: transform .12s, box-shadow .2s;
}
.pill:hover { box-shadow: 0 4px 14px rgba(var(--shadow),.18); }
.pill:active { transform: translateY(1px); }
.pill.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.pill.ghost:hover { background: var(--chip); }
.pill:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.note { font-size: 11.5px; line-height: 1.6; color: var(--muted); }

@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding: 20px 16px 48px; gap: 16px; }
  .profile-card { position: static; }
  .frm-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .topbar { padding: 16px 18px; }
  .card { padding: 18px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">智绘课成<small>Teacher · 个人设置</small></div>
  <a class="back" href="course-generate.html">← 返回工作台</a>
</header>

<main class="wrap">
  <!-- 左栏：个人概览 -->
  <section class="card profile-card">
    <div class="avatar" id="avatar">教</div>
    <div class="who">
      <h2 id="uName">—</h2>
      <p class="sub"><span class="badge" id="uRole">教师端</span></p>
    </div>
    <div class="acct-list">
      <div class="acct-row"><span class="k">账号</span><span class="v" id="uUsername">—</span></div>
      <div class="acct-row"><span class="k">注册时间</span><span class="v" id="uCreated">—</span></div>
    </div>
    <div class="acct-actions">
      <button class="pill ghost" id="themeBtn" onclick="toggleTheme()">切换到深色主题</button>
      <button class="pill ghost" onclick="doSwitchAccount(this)">退出并切换账号</button>
    </div>
  </section>

  <!-- 右栏：资料与密码 -->
  <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
    <section class="card">
      <div class="card-head">
        <h3>基本资料</h3>
        <p>资料保存到账号本身，下次登录仍然生效。</p>
      </div>
      <div class="frm-grid">
        <div class="frm-row full"><label>昵称 / 姓名</label><input id="pfName" type="text" maxlength="20" placeholder="请输入昵称或姓名"></div>
        <div class="frm-row"><label>手机号</label><input id="pfPhone" type="text" maxlength="11" placeholder="选填，11 位手机号"></div>
        <div class="frm-row"><label>邮箱</label><input id="pfEmail" type="text" placeholder="选填，用于接收通知"></div>
      </div>
      <div class="msg" id="pfMsg"></div>
      <div class="foot"><button class="pill" id="saveBtn" onclick="saveProfile(this)">保存资料</button></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>修改密码</h3>
        <p>改完密码后当前登录状态保持，下次登录请使用新密码。</p>
      </div>
      <div class="frm-grid" style="grid-template-columns:1fr">
        <div class="frm-row"><label>当前密码</label><input id="pfOld" type="password" autocomplete="current-password" placeholder="请输入当前密码"></div>
        <div class="frm-row"><label>新密码（至少 6 位）</label><input id="pfNew" type="password" autocomplete="new-password" placeholder="设置新密码"></div>
        <div class="frm-row"><label>确认新密码</label><input id="pfNew2" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div>
      </div>
      <div class="msg" id="pfPwdMsg"></div>
      <div class="foot"><button class="pill ghost" onclick="submitPasswordChange(this)">更新密码</button></div>
    </section>
  </div>
</main>

<script>
function readUserInfo() {
  try { return JSON.parse(localStorage.getItem('userInfo') || '{}') || {}; } catch (e) { return {}; }
}
function roleLabel(role) {
  if (role === 'student') return '学生端';
  if (role === 'admin') return '管理端';
  return '教师端';
}
function getAuthHeaders() {
  var token = localStorage.getItem('token') || '';
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}
function apiRequest(url, options) {
  options = options || {};
  options.headers = Object.assign(getAuthHeaders(), options.headers || {});
  return fetch(url, options).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('token');
      localStorage.removeItem('userInfo');
      window.location.href = 'index.html';
      return Promise.reject(new Error('未登录'));
    }
    return res.json();
  });
}
function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function fmtTime(s) { return s ? String(s).replace('T', ' ').substring(0, 16) : '—'; }

var me = null;

function setMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.textContent = text || '';
  el.className = 'msg' + (ok ? ' ok' : (text ? ' err' : ''));
}

function renderMe(u) {
  me = u;
  var name = u.realName || u.username || '教师';
  document.getElementById('uName').textContent = name;
  document.getElementById('avatar').textContent = name.charAt(0) || '教';
  document.getElementById('uUsername').textContent = u.username || '—';
  document.getElementById('uRole').textContent = roleLabel(u.role);
  document.getElementById('uCreated').textContent = fmtTime(u.createdAt);
  document.getElementById('pfName').value = u.realName || '';
  document.getElementById('pfPhone').value = u.phone || '';
  document.getElementById('pfEmail').value = u.email || '';
  localStorage.setItem('userInfo', JSON.stringify(u));
}

function loadMe() {
  apiRequest('/api/auth/me').then(function (res) {
    if (!res || res.code !== 200 || !res.data) { window.location.href = 'index.html'; return; }
    renderMe(res.data);
  }).catch(function () { window.location.href = 'index.html'; });
}

/* 明暗主题，与工作台共用 cg_theme 存储 */
function syncThemeBtn() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeBtn').textContent = dark ? '切换到浅色主题' : '切换到深色主题';
}
(function initTheme() {
  if (localStorage.getItem('cg_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  syncThemeBtn();
})();
function toggleTheme() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('cg_theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('cg_theme', 'dark');
  }
  syncThemeBtn();
}

function saveProfile(btn) {
  var name = (document.getElementById('pfName').value || '').trim();
  var phone = (document.getElementById('pfPhone').value || '').trim();
  var email = (document.getElementById('pfEmail').value || '').trim();
  if (!name) { setMsg('pfMsg', '昵称不能为空', false); return; }
  if (phone && !/^1[3-9]\d{9}$/.test(phone)) { setMsg('pfMsg', '手机号格式不正确', false); return; }
  if (email && !/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) { setMsg('pfMsg', '邮箱格式不正确', false); return; }
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = '保存中…';
  apiRequest('/api/auth/profile', {
    method: 'POST',
    body: JSON.stringify({ realName: name, phone: phone, email: email })
  }).then(function (res) {
    btn.disabled = false; btn.textContent = label;
    if (!res || res.code !== 200) { setMsg('pfMsg', (res && res.message) || '保存失败', false); return; }
    renderMe(Object.assign({}, me || {}, res.data || {}));
    setMsg('pfMsg', '已保存，账号信息已同步', true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = label;
    setMsg('pfMsg', '保存失败：' + ((e && e.message) || '网络异常'), false);
  });
}

function submitPasswordChange(btn) {
  var oldPwd = document.getElementById('pfOld').value || '';
  var newPwd = document.getElementById('pfNew').value || '';
  var newPwd2 = document.getElementById('pfNew2').value || '';
  if (!oldPwd) { setMsg('pfPwdMsg', '请输入当前密码', false); return; }
  if (newPwd.length < 6) { setMsg('pfPwdMsg', '新密码长度不能少于 6 位', false); return; }
  if (newPwd !== newPwd2) { setMsg('pfPwdMsg', '两次输入的新密码不一致', false); return; }
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = '提交中…';
  apiRequest('/api/auth/password', {
    method: 'POST',
    body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
  }).then(function (res) {
    btn.disabled = false; btn.textContent = label;
    if (!res || res.code !== 200) { setMsg('pfPwdMsg', (res && res.message) || '修改失败', false); return; }
    document.getElementById('pfOld').value = '';
    document.getElementById('pfNew').value = '';
    document.getElementById('pfNew2').value = '';
    setMsg('pfPwdMsg', '密码已更新，下次登录请使用新密码', true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = label;
    setMsg('pfPwdMsg', '修改失败：' + ((e && e.message) || '网络异常'), false);
  });
}

function doSwitchAccount(btn) {
  btn.disabled = true; btn.textContent = '正在退出…';
  apiRequest('/api/auth/logout', { method: 'POST' }).catch(function () {}).then(function () {
    localStorage.removeItem('token');
    localStorage.removeItem('userInfo');
    window.location.href = 'index.html';
  });
}

loadMe();
</script>
</body>
</html>
