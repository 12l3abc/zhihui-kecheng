/* ---- 作答浮层倒计时：秒级刷新，临近24小时转橙、1小时内红色脉冲 ---- */
var cdTimer = null;
function parseDt(s) {
  if (!s) return null;
  var d = new Date(String(s).replace('T', ' '));
  return isNaN(d.getTime()) ? null : d;
}
function fmtCountdown(ms) {
  if (ms == null) return '';
  if (ms <= 0) return '已截止';
  var sec = Math.floor(ms / 1000);
  var d = Math.floor(sec / 86400); sec %= 86400;
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  function p(x) { return String(x).padStart(2, '0'); }
  if (d > 0) return '剩 ' + d + '天' + (h > 0 ? h + '时' : '');
  return '剩 ' + p(h) + ':' + p(m) + ':' + p(s);
}
function startCountdown(deadlineStr) {
  stopCountdown();
  var el = document.getElementById('ovCountdown');
  if (!el) return;
  var target = parseDt(deadlineStr);
  if (!target) { el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'inline-flex';
  function tick() {
    var ms = target.getTime() - Date.now();
    el.textContent = fmtCountdown(ms);
    el.className = 'cd-badge' + (ms <= 0 ? ' expired' : (ms < 3600000 ? ' danger' : (ms < 86400000 ? ' warn' : '')));
    if (ms <= 0) stopCountdown();
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}
function stopCountdown() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
/* 目录卡片静态剩余时间（不跳秒），返回 {text, cls} */
function cardRemain(deadlineStr) {
  var t = parseDt(deadlineStr); if (!t) return null;
  var ms = t.getTime() - Date.now();
  if (ms <= 0) return { text: '已截止', cls: 'expired' };
  var sec = Math.floor(ms / 1000), d = Math.floor(sec / 86400); sec %= 86400;
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  var txt = d > 0 ? '剩 ' + d + '天' + (h > 0 ? h + '时' : '') : (h > 0 ? '剩 ' + h + '时' + m + '分' : '剩 ' + m + '分');
  return { text: txt, cls: ms < 3600000 ? 'danger' : (ms < 86400000 ? 'warn' : '') };
}

function openOverlay() {
  var t = state.selTask; if (!t) return;
  currentTaskId = t.id;
  currentResult = null;
  currentTaskLocked = false;
  stopStudyClock();
  api('/api/tasks/' + t.id).then(function (res) {
    if (res.code !== 200) { showError(res); return; }
    var task = res.data.task || {};
    var contentHtml = res.data.contentHtml || '';
    document.getElementById('ovTitle').textContent = task.title || '—';
    document.getElementById('ovMeta').textContent =
      '班级：' + (task.className || '—') + '　截止：' + fmtTime(task.deadline) + '　· 课件与教师端实时同源';
    currentAnimationId = task.animationId;
    document.getElementById('detailFrame').srcdoc = buildThemedDoc(contentHtml);
    if (window.__ovZoom) window.__ovZoom.reset();
    document.getElementById('detailSummary').textContent = '';
    document.getElementById('submitMsg').textContent = '';
    currentQuestions = res.data.questions || [];
    var ovStats = document.getElementById('ovStats');
    if (ovStats) {
      var nq = currentQuestions.length;
      ovStats.textContent = nq ? '共 ' + nq + ' 题' : '';
      ovStats.style.display = nq ? 'inline-flex' : 'none';
    }
    document.getElementById('overlay').classList.add('open');
    setTimeout(function () { if (window.positionOvSplit) window.positionOvSplit(); }, 60);

    // 任务关闭或超过截止时间：未提交学生锁定作答表单；已提交学生仍可经 my-result 只读回顾
    var closed = task.status === 'CLOSED';
    var deadlineExpired = task.deadline && new Date(String(task.deadline).replace('T', ' ')).getTime() < Date.now();
    // 教师打回顺延：持有未过期的单独补交截止时，即使全局过期也可作答
    var extDeadline = res.data.extendDeadline;
    var extActive = !!extDeadline && new Date(String(extDeadline).replace('T', ' ')).getTime() > Date.now();
    currentTaskLocked = closed || (deadlineExpired && !extActive);
    // 倒计时：顺延生效用补交截止，否则用任务截止；锁定态定格“已截止”不跳动
    if (!currentTaskLocked) {
      startCountdown(extActive ? extDeadline : task.deadline);
    } else {
      stopCountdown();
      var cdEl = document.getElementById('ovCountdown');
      if (cdEl) { cdEl.style.display = 'inline-flex'; cdEl.textContent = closed ? '任务已关闭' : '已截止'; cdEl.className = 'cd-badge expired'; }
    }
    if (currentTaskLocked) {
      document.getElementById('submitBar').style.display = 'none';
      var lockMsg = closed ? '任务已关闭，暂无法作答。' : '已超过截止时间，暂无法作答。';
      document.getElementById('qCardTitle').textContent = closed ? '任务已关闭' : '任务已截止';
      document.getElementById('questionArea').innerHTML =
        '<div class="empty">' + lockMsg + '如需补交请联系任课老师。</div>';
    } else {
      // 已放开学习门禁：进入任务直接展示题目作答；参考答案仅在提交后经 my-result 展示
      document.getElementById('submitBar').style.display = 'flex';
      document.getElementById('submitBtn').style.display = '';
      renderQuestions(currentQuestions);
      if (extActive) {
        document.getElementById('submitMsg').textContent = '教师已为你顺延补交，截止：' + fmtTime(extDeadline);
      }
    }
    loadMyResult(t.id, currentQuestions);
    startStudyClock();

    // 教师催交提醒：有未读则在作答区顶部展示横幅（接口同时将其标记已读）
    api('/api/tasks/' + t.id + '/remind').then(function(r) {
      // 进入作业即视为已读：从未读集合移除，卡片角标随之消失
      delete state.unreadReminds[t.id];
      if (state.tab === 'tasks') renderTabs();
      if (r.code === 200 && r.data && r.data.hasUnread) {
        var qa = document.getElementById('questionArea');
        if (qa && !document.getElementById('remindBanner')) {
          var b = document.createElement('div');
          b.id = 'remindBanner';
          b.style.cssText = 'margin-bottom:12px;padding:10px 12px;border-radius:10px;background:rgba(196,30,58,.08);border:1px solid rgba(196,30,58,.25);color:#c41e3a;font-size:13px;font-weight:600;line-height:1.6';
          b.textContent = '老师催交：请尽快完成并提交本次作业。';
          qa.insertBefore(b, qa.firstChild);
        }
      }
    }).catch(function() {});

    if (currentAnimationId) {
      api('/api/ai/' + currentAnimationId).then(function (r) {
        if (r.code === 200 && r.data && r.data.summary) {
          document.getElementById('detailSummary').textContent = '重点知识提炼：\n' + r.data.summary;
        }
      });
      loadFeedback(currentAnimationId);
    }
  }).catch(showError);
}

/** 已提交：只读回顾自己的作答、得分与教师定稿答案 */
function renderOwnResult(questions, result) {
  var area = document.getElementById('questionArea');
  var byId = {};
  (result.answers || []).forEach(function (a) { byId[a.questionId] = a; });

  var objectiveFull = 0;
  questions.forEach(function (q) {
    if (q.questionType === 'objective') objectiveFull += Number(q.score || 0);
  });
  var graded = result.status === 'GRADED';
  var statusText = graded ? '已批阅' : '等待老师批阅';
  var scoreLine = '客观题得分 ' + (result.objectiveScore || 0) + ' / ' + objectiveFull + ' 分';
  if (graded) {
    scoreLine += '　总分 ' + (result.totalScore || 0) + ' 分（主观题 ' + (result.teacherScore || 0) + ' 分）';
  } else {
    scoreLine += '　主观题待老师批阅';
  }
  var comment = result.comment
    ? '<div class="comment"><b>老师评语：</b>' + esc(result.comment) + '</div>'
    : '';
  var summary = '<div class="result-summary">' +
    '<div class="title">已提交 · ' + statusText + '</div>' +
    '<div class="line">' + scoreLine + '</div>' + comment + '</div>';

  area.innerHTML = summary + questions.map(function (q, i) {
    var a = byId[q.id] || {};
    var typeTag = q.questionType === 'objective'
      ? '<span class="badge done">客观题 ' + q.score + ' 分</span>'
      : '<span class="badge warn">主观题 ' + q.score + ' 分</span>';
    var body = '';

    if (q.questionType === 'objective') {
      var opts = [];
      if (q.options) { try { opts = JSON.parse(q.options); } catch (e) { opts = []; } }
      var picked = a.studentAnswer ? String(a.studentAnswer).trim().toUpperCase() : '';
      var correct = a.correctAnswer ? String(a.correctAnswer).trim().toUpperCase() : '';
      body = '<div class="opts">' + opts.map(function (o) {
        var letter = String(o).charAt(0).toUpperCase();
        var cls = '';
        if (letter === correct) cls += ' answer-key';
        if (letter === picked) cls += (letter === correct ? '' : ' student-wrong');
        return '<label class="' + cls.trim() + '"><input type="radio" disabled' + (letter === picked ? ' checked' : '') + '> ' + esc(o) + '</label>';
      }).join('') + '</div>';
      var judge = a.isCorrect === 1
        ? '<span class="tag-ok">✓ 正确</span>'
        : (a.isCorrect === 0 ? '<span class="tag-no">✗ 错误</span>' : '<span class="tag-wait">未作答</span>');
      var correctText = correct
        ? (opts.filter(function (o) { return String(o).charAt(0).toUpperCase() === correct; })[0] || correct)
        : '老师尚未设置';
      body += '<div class="review-line"><span class="k">你的答案：</span><span class="v">' + (picked ? esc(picked) : '未作答') + '</span>' + judge + '</div>' +
        '<div class="review-line"><span class="k">正确答案：</span><span class="v">' + esc(correctText) + '</span></div>';
    } else {
      body = '<div class="review-line"><span class="k">你的答案：</span><span class="v">' + (a.studentAnswer ? esc(a.studentAnswer) : '未作答') + '</span></div>' +
        '<div class="review-answer"><span class="k">参考答案（教师定稿）</span><span class="v">' +
        (a.correctAnswer ? esc(a.correctAnswer) : '老师尚未填写参考答案') + '</span></div>';
    }

    return '<div class="qbox">' +
      '<div class="qt"><span>第 ' + (i + 1) + ' 题　' + esc(q.questionText) + '</span>' + typeTag + '</div>' +
      body + '</div>';
  }).join('');

  document.getElementById('qCardTitle').textContent = '作答回顾与参考答案';
  document.getElementById('submitBar').style.display = 'none';
  document.getElementById('submitMsg').textContent = '';
}

function renderQuestions(questions, result) {
  if (!questions.length) { document.getElementById('questionArea').innerHTML = '<div class="empty">该任务暂无配套题目</div>'; return; }
  if (result && result.submitted) { renderOwnResult(questions, result); return; }

  document.getElementById('qCardTitle').textContent = '在线作答';
  document.getElementById('submitBar').style.display = 'flex';
  document.getElementById('submitBtn').style.display = '';
  var area = document.getElementById('questionArea');
  area.innerHTML = questions.map(function (q, i) {
    var optsHtml = '';
    if (q.options) {
      try {
        var opts = JSON.parse(q.options);
        optsHtml = '<div class="opts">' + opts.map(function (o) {
          var letter = String(o).charAt(0);
          return '<label><input type="radio" name="q' + q.id + '" value="' + letter + '"> ' + esc(o) + '</label>';
        }).join('') + '</div>';
      } catch (e) { /* ignore */ }
    }
    var inputHtml = q.questionType === 'objective'
      ? optsHtml
      : '<textarea id="subj' + q.id + '" placeholder="请输入你的答案"></textarea>';
    var typeTag = q.questionType === 'objective'
      ? '<span class="badge done">客观题 ' + q.score + ' 分</span>'
      : '<span class="badge warn">主观题 ' + q.score + ' 分</span>';
    return '<div class="qbox">' +
      '<div class="qt"><span>第 ' + (i + 1) + ' 题　' + esc(q.questionText) + '</span>' + typeTag + '</div>' +
      inputHtml + '</div>';
  }).join('');
}

function submitAnswer() {
  var taskId = currentTaskId;
  if (!taskId) return;
  if (currentTaskLocked) { toastMsg('任务已关闭或已截止，无法提交', 'warn'); return; }
  var answers = [];
  document.querySelectorAll('#questionArea .qbox').forEach(function (box) {
    var radio = box.querySelector('input[type="radio"]:checked');
    var subj = box.querySelector('textarea');
    var qid = null;
    var m = box.innerHTML.match(/name="q(\d+)"/);
    if (m) qid = Number(m[1]);
    if (radio) answers.push({ questionId: qid, answerText: radio.value });
    else if (subj && subj.value.trim()) answers.push({ questionId: qid, answerText: subj.value.trim() });
  });
  if (!answers.length) { toastMsg('请至少作答一题', 'warn'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';
  api('/api/tasks/' + taskId + '/submit', 'POST', { answers: answers }).then(function (res) {
    if (res.code !== 200) {
      btn.disabled = false;
      btn.textContent = '提交作答';
      showError(res);
      return;
    }
    submittedTasks[taskId] = true;
    // 重建任务状态映射，让卡片即时从「待完成」切到「已完成」，并从待完成筛选中移除
    refreshTaskStatus();
    document.getElementById('submitMsg').textContent =
      '提交成功！客观题得分：' + res.data.objectiveScore + ' 分。' +
      (res.data.status === 'GRADED' ? '（全客观题，已自动批阅）' : '（含主观题，等待老师批阅）');
    // 提交成功后切换为作答回顾，参考答案只在此刻之后展示
    loadMyResult(taskId, currentQuestions);
  }).catch(function (err) {
    btn.disabled = false;
    btn.textContent = '提交作答';
    showError(err);
  });
}

function loadFeedback(animationId) {
  if (!animationId) return;
  api('/api/feedback/courseware/' + animationId).then(function (res) {
    if (res.code !== 200) return;
    var list = res.data || [];
    var box = document.getElementById('feedbackList');
    if (!list.length) { box.innerHTML = '<div class="empty" style="padding:14px">还没有评价和疑问，来做第一个吧。</div>'; return; }
    box.innerHTML = list.map(function (f) {
      var typeBadge = f.type === 'evaluation'
        ? '<span class="badge done">评价</span>'
        : '<span class="badge warn">疑问</span>';
      return '<div class="fb-item"><div class="meta">' + typeBadge +
        '<span>' + esc(f.studentName || '匿名') + '</span><span>·</span><span>' + fmtTime(f.createdAt) + '</span></div>' +
        '<div class="content">' + esc(f.content) + '</div></div>';
    }).join('');
  }).catch(function () {});
}

function submitFeedback() {
  if (!currentAnimationId) { toastMsg('课件信息缺失', 'warn'); return; }
  var type = document.getElementById('fbType').value;
  var content = document.getElementById('fbContent').value.trim();
  if (!content) { toastMsg('请输入评价或疑问内容', 'warn'); return; }
  if (content.length > 1000) { toastMsg('内容不能超过 1000 字', 'warn'); return; }
  api('/api/feedback', 'POST', { animationId: currentAnimationId, type: type, content: content }).then(function (res) {
    if (res.code !== 200) { toastMsg(res.message || '提交失败', 'error'); return; }
    document.getElementById('fbContent').value = '';
    document.getElementById('fbMsg').textContent = '提交成功';
    setTimeout(function () { document.getElementById('fbMsg').textContent = ''; }, 2000);
    loadFeedback(currentAnimationId);
  }).catch(showError);
}

/* ================= 中栏舞台控制（缩放 / 重置 / 独立全屏） ================= */
(function () {
  var stage = document.getElementById('stage');
  var frame = document.getElementById('animFrame');
  function applyScale() {
    document.getElementById('stageInner').style.transform = 'scale(' + stageScale + ')';
    document.getElementById('zoomIn').classList.toggle('on', stageScale >= 1.05);
    document.getElementById('zoomOut').classList.toggle('on', stageScale <= 0.95);
  }
  document.getElementById('zoomIn').addEventListener('click', function () { setStageScale(stageScale + 0.2); applyScale(); });
  document.getElementById('zoomOut').addEventListener('click', function () { setStageScale(stageScale - 0.2); applyScale(); });
  document.getElementById('resetView').addEventListener('click', function () { setStageScale(1); applyScale(); });

  /* ===== 栏宽拖拽分隔条 ===== */
  (function initSplitters() {
    var hero = document.getElementById('hero');
    var splitSide = document.getElementById('splitSide');
    var splitInfo = document.getElementById('splitInfo');
    var splitOv = document.getElementById('splitOv');
    var ovBody = document.querySelector('.ov-body');
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    // 通用拖拽：begin() 在按下时取快照，move(snap, dx) 拖动中回调
    function drag(handle, begin, move) {
      handle.addEventListener('mousedown', function (e) {
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, snap = begin();
        handle.classList.add('active');
        document.body.classList.add('resizing');
        function mv(ev) { move(snap, ev.clientX - sx); }
        function up() {
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
          handle.classList.remove('active');
          document.body.classList.remove('resizing');
        }
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      });
    }
    // 主三栏：侧栏 | 中栏 | 右栏
    var sideW = 210, infoW = 300;
    try { var s = localStorage.getItem('cw_sideW'); if (s) sideW = +s; } catch (e) {}
    try { var i = localStorage.getItem('cw_infoW'); if (i) infoW = +i; } catch (e) {}
    function applyMain() {
      hero.style.gridTemplateColumns = sideW + 'px minmax(0,1fr) ' + infoW + 'px';
      splitSide.style.left = (sideW - 4) + 'px';
      splitInfo.style.right = (infoW - 4) + 'px';
      try { localStorage.setItem('cw_sideW', sideW); localStorage.setItem('cw_infoW', infoW); } catch (e) {}
    }
    drag(splitSide, function () { return sideW; }, function (snap, dx) {
      sideW = clamp(snap + dx, 160, 380); applyMain();
    });
    drag(splitInfo, function () { return infoW; }, function (snap, dx) {
      infoW = clamp(snap - dx, 220, 460); applyMain();
    });
    applyMain();
    // 浮层：课件区 | 作答区
    function positionOvSplit() {
      if (!ovBody || !splitOv) return;
      var fw = document.querySelector('.ov-frame');
      var left = fw ? fw.offsetWidth : Math.round(ovBody.clientWidth * 0.62);
      splitOv.style.left = (left + 7) + 'px';
    }
    window.positionOvSplit = positionOvSplit;
    drag(splitOv, function () {
      var fw = document.querySelector('.ov-frame');
      var ob = document.querySelector('.ov-body');
      return { left: fw ? fw.offsetWidth : 480, total: ob ? ob.clientWidth : 900 };
    }, function (snap, dx) {
      var ob = document.querySelector('.ov-body'); if (!ob) return;
      var left = clamp(snap.left + dx, 300, snap.total - 320);
      ob.style.gridTemplateColumns = left + 'px minmax(0,1fr)';
      splitOv.style.left = (left + 7) + 'px';
    });
  })();

  stage.addEventListener('wheel', function (e) {
    // 成绩/反馈概览面板接管舞台时放行浏览器默认内部滚动，不拦截、不缩放
    if (document.getElementById('gradeDash').classList.contains('on') ||
        document.getElementById('gradeDetailDash').classList.contains('on') ||
        document.getElementById('fbDash').classList.contains('on')) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    setStageScale(stageScale + delta); applyScale();
  }, { passive: false });
  stage.addEventListener('dblclick', function () { setStageScale(1); applyScale(); });

  function setInnerFs(on, baseW, baseH) {
    var d = null;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    if (on) {
      var vw = window.innerWidth || 1400, vh = window.innerHeight || 900;
      var z = Math.min(2.5, Math.max(1, Math.min(vw / Math.max(320, baseW || 800), vh / Math.max(220, baseH || 560))));
      d.body.style.zoom = String(Math.round(z * 1000) / 1000);
      d.documentElement.classList.add('cwl-fs');
    } else {
      d.body.style.zoom = '';
      d.documentElement.classList.remove('cwl-fs');
    }
  }
  function syncFsUi(on) {
    var b = document.getElementById('expandBtn');
    if (b) b.classList.toggle('on', on);
    if (!on) document.body.style.overflow = '';
  }
  function enterAnimFs() {
    setStageScale(1); applyScale();
    var baseW = frame.clientWidth || stage.clientWidth;
    var baseH = frame.clientHeight || stage.clientHeight;
    if (stage.requestFullscreen) {
      stage.requestFullscreen().then(function () {
        syncFsUi(true);
        setTimeout(function () { setInnerFs(true, baseW, baseH); }, 80);
      }).catch(function () {
        stage.classList.add('faux-fs');
        document.body.style.overflow = 'hidden';
        syncFsUi(true);
        setTimeout(function () { setInnerFs(true, baseW, baseH); }, 60);
      });
    } else {
      stage.classList.add('faux-fs');
      document.body.style.overflow = 'hidden';
      syncFsUi(true);
      setTimeout(function () { setInnerFs(true, baseW, baseH); }, 60);
    }
  }
  function exitAnimFs() {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (stage.classList.contains('faux-fs')) {
      stage.classList.remove('faux-fs');
      document.body.style.overflow = '';
      syncFsUi(false);
      setInnerFs(false);
    }
  }
  document.getElementById('expandBtn').addEventListener('click', function () {
    if (document.fullscreenElement === stage || stage.classList.contains('faux-fs')) exitAnimFs();
    else enterAnimFs();
  });
  document.getElementById('fsExit').addEventListener('click', exitAnimFs);
  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement !== stage && !stage.classList.contains('faux-fs')) {
      syncFsUi(false);
      setInnerFs(false);
    }
  });
})();

// ===== 浮层课件缩放 / 全屏 =====
(function () {
  var frame = document.getElementById('detailFrame');
  var ovFrame = document.querySelector('.ov-frame');
  var zoom = 1;
  function frameDoc() { try { return frame.contentDocument; } catch (e) { return null; } }
  function applyZoom() {
    var d = frameDoc();
    if (d && d.body) d.body.style.zoom = String(zoom);
    var bi = document.getElementById('ovZoomIn');
    var bo = document.getElementById('ovZoomOut');
    if (bi) bi.classList.toggle('on', zoom >= 1.05);
    if (bo) bo.classList.toggle('on', zoom <= 0.95);
  }
  function step(delta) { zoom = Math.min(2.5, Math.max(0.5, +(zoom + delta).toFixed(2))); applyZoom(); }
  function syncFs(on) {
    var b = document.getElementById('ovExpand');
    if (b) b.classList.toggle('on', on);
    document.body.style.overflow = on ? 'hidden' : '';
  }
  function enterFaux() { ovFrame.classList.add('faux-fs'); syncFs(true); }
  function exitFs() {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    ovFrame.classList.remove('faux-fs');
    syncFs(false);
  }
  function enterFs() {
    if (ovFrame.requestFullscreen) {
      ovFrame.requestFullscreen().then(function () { syncFs(true); }).catch(function () { enterFaux(); });
    } else { enterFaux(); }
  }
  document.getElementById('ovZoomIn').addEventListener('click', function () { step(0.25); });
  document.getElementById('ovZoomOut').addEventListener('click', function () { step(-0.25); });
  document.getElementById('ovZoomReset').addEventListener('click', function () { zoom = 1; applyZoom(); });
  document.getElementById('ovExpand').addEventListener('click', function () {
    if (document.fullscreenElement === ovFrame || ovFrame.classList.contains('faux-fs')) exitFs();
    else enterFs();
  });
  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement !== ovFrame && !ovFrame.classList.contains('faux-fs')) syncFs(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ovFrame.classList.contains('faux-fs')) exitFs();
  });
  window.__ovZoom = { reset: function () { zoom = 1; applyZoom(); }, apply: applyZoom, exitFs: exitFs };
})();
</script>
